<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Abibatou Joop · Développeuse web full-stack</title>
  <meta name="description" content="Portfolio d'Abibatou Joop, développeuse web full-stack (Laravel, Angular, PostgreSQL).">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    // Applique le thème avant le premier affichage (évite un flash blanc en mode sombre).
    try {
      var t = localStorage.getItem('portfolio.theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
